name: CI Tests

# CI runs on main only (Micah, 2026-09-10): workers checkpoint on bean
# branches and verify lands them on main; a red side-branch checkpoint must
# never look like a main regression. Fix branches rely on the local bb ci gate.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out isaac-cli-server
        uses: actions/checkout@v4

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          bb: latest

      - name: Cache Babashka dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-bb-cli-server-${{ hashFiles('bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-bb-cli-server-

      - name: Run bb ci
        run: bb ci