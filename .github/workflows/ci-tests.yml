name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out isaac-cli-server
        uses: actions/checkout@v4

      - name: Set up Babashka
        uses: babashka/setup-babashka@v1
        with:
          bb-version: latest

      - name: Cache Babashka dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-bb-cli-server-${{ hashFiles('bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-bb-cli-server-

      - name: Run bb ci
        run: bb ci